name: Guestbook protection
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/guestbook-ui.test.cjs
      - run: psql postgresql://postgres:postgres@localhost:5432/drift_test -v ON_ERROR_STOP=1 -f tests/guestbook.sql
      - run: python3 tests/guestbook-concurrency.py
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drift_test
